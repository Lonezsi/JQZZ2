services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: jqzzdb
      MYSQL_USER: jqzz
      MYSQL_PASSWORD: jqzz
      MYSQL_ROOT_PASSWORD: jqzz-root
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ujqzz", "-pjqzz"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend/jqzz
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/jqzzdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: jqzz
      SPRING_DATASOURCE_PASSWORD: jqzz
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  db-data:
