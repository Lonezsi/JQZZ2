# Default: file-based H2 database (./data/jqzzdb). Needs no setup and survives restarts.
# For MySQL, run with the "mysql" profile, or override spring.datasource.* through
# environment variables (SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, ...).
spring.datasource.url=jdbc:h2:file:./data/jqzzdb
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# send ResponseStatusException reasons (e.g. "Handle is already taken") to the client
spring.web.error.include-message=always

# text goes out compressed: the script is 533 KB raw, about 167 KB gzipped
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,text/plain,application/javascript,text/javascript,application/json,image/svg+xml
server.compression.min-response-size=1024

# Google sign-in: the OAuth web client id. Empty turns it off.
jqzz.google.client-id=${JQZZ_GOOGLE_CLIENT_ID:}
