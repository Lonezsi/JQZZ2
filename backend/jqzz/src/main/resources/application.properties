# Default: file-based H2 database (./data/jqzzdb). Needs no setup and survives restarts.
# For MySQL, run with the "mysql" profile, or override spring.datasource.* through
# environment variables (SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, ...).
spring.datasource.url=jdbc:h2:file:./data/jqzzdb
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# how much picture one account, and everyone together, may keep (ImageService.roomFor)
jqzz.pictures.per-hour=30
jqzz.pictures.per-account-mb=200
jqzz.pictures.total-mb=5120

# send ResponseStatusException reasons (e.g. "Handle is already taken") to the client
spring.web.error.include-message=always

# text goes out compressed: the script is 533 KB raw, about 167 KB gzipped
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,text/plain,application/javascript,text/javascript,application/json,image/svg+xml
server.compression.min-response-size=1024

# Google sign-in: the OAuth web client id. Empty turns it off.
jqzz.google.client-id=${JQZZ_GOOGLE_CLIENT_ID:}

# Foyer, the home server's one sign-in (FoyerAuth): asked over the loopback who its cookie
# belongs to. Empty turns it off.
jqzz.foyer.url=${JQZZ_FOYER_URL:http://127.0.0.1:7000}

# the API map and its explorer aren't for the public
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# the key cookie: Secure, and on the path the browser sees (the Funnel strips /jqzz; the host's
# Start-Jqzz.ps1 passes --jqzz.cookie.path=/jqzz/)
jqzz.cookie.secure=true
jqzz.cookie.path=/
