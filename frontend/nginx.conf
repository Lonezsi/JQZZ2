server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # image uploads go through the proxy
    client_max_body_size 10m;

    # Proxy API requests to the backend. No trailing slash on the location, so
    # both "/quizzes" (list/create) and "/quizzes/1" match.
    location ~ ^/(quizzes|users|lobbies|game|images|play|stash|history|profile|friends|notifications)(/|$) {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy WebSocket (SockJS/STOMP) to the backend
    location /ws {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
    }

    # SPA fallback — serve index.html for all other routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
