<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon-white.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="JQZZ - Experience Interactive Quiz Gaming"
    />
    <script>
      // dark or light before the first paint: your pick from settings, else the device's
      (function () {
        var t;
        try {
          t = localStorage.getItem("jqzz.theme");
        } catch (e) {}
        if (t !== "dark" && t !== "light") {
          t = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
        document.documentElement.dataset.theme = t;
        // the plain fonts, if you picked them in settings
        try {
          if (localStorage.getItem("jqzz.fonts") === "clean") document.documentElement.dataset.fonts = "clean";
          if (localStorage.getItem("jqzz.effects") === "reduced") document.documentElement.dataset.effects = "reduced";
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Albert+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Instrument+Serif:ital@0;1&family=Spline+Sans+Mono:wght@400;500;700&display=swap"
    />
    <link rel="stylesheet" href="/src/index.css" />
    <title>JQZZ - Quiz Gaming Platform</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
